[project]
name = "airadar"
version = "0.1.0"
description = "AI Radar API — semantic landscape of trending dev/AI tools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.5.0",
    "httpx>=0.28.1",
    "apscheduler>=3.11.3,<4",
    "sse-starlette>=3.4.5",
    "pydantic-settings>=2.14.2",
    "fastembed>=0.8.0",
    "umap-learn>=0.5.12",
    "scikit-learn>=1.9.0",
    "numpy>=2.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.15.21"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"airadar.infrastructure.sources" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running postgres with pgvector",
    "slow: downloads ML models / long-running",
]

[tool.ruff]
line-length = 100
