[project]
name = "airadar"
version = "0.1.0"
description = "AI Radar API — semantic landscape of trending dev/AI tools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "fastembed>=0.3",
    "umap-learn>=0.5.6",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires a running postgres with pgvector"]

[tool.ruff]
line-length = 100
