<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#0a1626"/>
      <stop offset="60%" stop-color="#060c16"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#74e0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#74e0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#74e0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#74e0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- range rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#74e0ff" stroke-opacity="0.34" stroke-width="7"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#74e0ff" stroke-opacity="0.22" stroke-width="5"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#74e0ff" stroke-opacity="0.16" stroke-width="4"/>

  <!-- crosshair -->
  <line x1="256" y1="60" x2="256" y2="452" stroke="#74e0ff" stroke-opacity="0.1" stroke-width="4"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#74e0ff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- sweep beam (from centre towards upper right) -->
  <path d="M 256 256 L 256 60 A 196 196 0 0 1 415 141 Z" fill="url(#sweep)"/>
  <line x1="256" y1="256" x2="256" y2="60" stroke="#74e0ff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>

  <!-- contacts, coloured by adoption ring -->
  <circle cx="332" cy="152" r="17" fill="#57e0a8"/>
  <circle cx="352" cy="308" r="13" fill="#74e0ff"/>
  <circle cx="172" cy="342" r="11" fill="#e6c46a"/>

  <!-- centre -->
  <circle cx="256" cy="256" r="42" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="13" fill="#74e0ff"/>
</svg>
