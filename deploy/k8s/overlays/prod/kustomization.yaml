apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Point at your registry + immutable tags (set by CI).
images:
  - name: airadar-api
    newName: ghcr.io/your-org/airadar-api
    newTag: v1.0.0
  - name: airadar-web
    newName: ghcr.io/your-org/airadar-web
    newTag: v1.0.0

replicas:
  - name: airadar-api
    count: 3
  - name: airadar-web
    count: 2

patches:
  - target: { kind: Ingress, name: airadar }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: airadar.example.com

# Secrets: apply out-of-band (never commit real values). Options:
#   1. kubectl apply -f ../../base/secret.yaml   (copied from secret.example.yaml)
#   2. Uncomment a secretGenerator here pointing at a gitignored env file:
# secretGenerator:
#   - name: airadar-secrets
#     behavior: create
#     envs: [secrets.env]
# generatorOptions:
#   disableNameSuffixHash: true
