apiVersion: apps/v1
kind: Deployment
metadata:
  name: airadar-api
  labels:
    app.kubernetes.io/name: airadar
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: airadar
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airadar
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: airadar-api
          args: ["uvicorn", "airadar.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: airadar-config }
            - secretRef: { name: airadar-secrets }
          startupProbe: # allow slow first connect without failing liveness
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: airadar-api
  labels:
    app.kubernetes.io/name: airadar
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: airadar
    app.kubernetes.io/component: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airadar-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: airadar-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: airadar-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airadar
      app.kubernetes.io/component: api
