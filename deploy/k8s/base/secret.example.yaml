# Template only — DO NOT commit real values. Copy to secret.yaml, fill in, and keep
# it out of git (see .gitignore) or supply via a sealed-secret / external-secrets / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: airadar-secrets
type: Opaque
stringData:
  # Full SQLAlchemy URL used by api, worker and the migrate Job.
  DATABASE_URL: "postgresql+psycopg://airadar:CHANGE_ME@airadar-db:5432/airadar"
  # Postgres StatefulSet bootstrap password (must match the password in DATABASE_URL).
  POSTGRES_PASSWORD: "CHANGE_ME"
  # Optional — raises the GitHub API rate limit from 60 to 5000 req/h.
  GITHUB_TOKEN: ""
