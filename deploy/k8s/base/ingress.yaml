apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airadar
  annotations:
    # SSE (/api/events) must stream — disable proxy buffering and allow long reads.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: airadar.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: airadar-api
                port: { number: 8000 }
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: airadar-api
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airadar-web
                port: { number: 3000 }
