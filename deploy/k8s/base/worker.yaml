# The single writer. Keep at replicas=1 (Recreate) — one scheduler owns ingestion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airadar-worker
  labels:
    app.kubernetes.io/name: airadar
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate # never run two schedulers at once
  selector:
    matchLabels:
      app.kubernetes.io/name: airadar
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airadar
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: airadar-api
          command: ["python", "-m", "airadar.worker"]
          envFrom:
            - configMapRef: { name: airadar-config }
            - secretRef: { name: airadar-secrets }
          livenessProbe: # heartbeat file, refreshed by the event loop every 30s
            exec:
              command: ["sh", "-c", "find /tmp/worker-alive -mmin -2 | grep -q ."]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "250m", memory: "1Gi" } # embeddings + UMAP/HDBSCAN
            limits: { cpu: "2", memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: airadar-model-cache
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airadar-model-cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
