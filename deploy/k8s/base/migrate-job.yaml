# Runs the schema migration once, before api/worker serve. The worker also ensures
# the schema idempotently on boot, so a stale/immutable Job never blocks a redeploy —
# this Job just makes tables exist before the API starts answering.
apiVersion: batch/v1
kind: Job
metadata:
  name: airadar-migrate
  labels:
    app.kubernetes.io/name: airadar
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airadar
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: airadar-api
          command: ["python", "-m", "airadar.migrate"]
          envFrom:
            - configMapRef: { name: airadar-config }
            - secretRef: { name: airadar-secrets }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
