apiVersion: apps/v1
kind: Deployment
metadata:
  name: airadar-web
  labels:
    app.kubernetes.io/name: airadar
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: airadar
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airadar
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: airadar-web
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              valueFrom: { configMapKeyRef: { name: airadar-config, key: API_URL } }
            - name: SITE_URL
              valueFrom: { configMapKeyRef: { name: airadar-config, key: SITE_URL } }
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: airadar-web
  labels:
    app.kubernetes.io/name: airadar
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: airadar
    app.kubernetes.io/component: web
  ports:
    - port: 3000
      targetPort: 3000
