services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: airadar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airadar}
      POSTGRES_DB: airadar
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airadar -d airadar"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot schema migration; api/worker wait for it to complete (no replica races).
  migrate:
    build: ./apps/api
    command: ["python", "-m", "airadar.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://airadar:${POSTGRES_PASSWORD:-airadar}@db:5432/airadar
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Read-only HTTP + SSE; scales horizontally. Listens for worker events over NOTIFY.
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://airadar:${POSTGRES_PASSWORD:-airadar}@db:5432/airadar
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"

  # The single writer: scheduled ingest → recompute → NOTIFY. Keep at one replica.
  worker:
    build: ./apps/api
    command: ["python", "-m", "airadar.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://airadar:${POSTGRES_PASSWORD:-airadar}@db:5432/airadar
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-30}
    volumes:
      - model-cache:/models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
  model-cache:
